[project]
name = "stopmotion"
version = "0.1.0"
description = "Stop-motion camera app for a Raspberry Pi"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# The CLI scripts predate the linter; task 02 refactors them into backend/render/
extend-exclude = ["stopmotion.py", "stopmotion_stabilised.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
