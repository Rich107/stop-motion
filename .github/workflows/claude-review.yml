name: Claude PR review

# Reviews every PR and posts findings as markdown (one summary comment plus inline comments).
# Needs the ANTHROPIC_API_KEY repository secret; skipped (not failed) until it's added.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when no API key is configured
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY not set; skipping Claude review"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR for a Raspberry Pi stop-motion app (FastAPI + htmx, picamera2, ffmpeg, OpenCV)
            used by a 6-year-old. Read docs/plan.md and the task file in docs/tasks/ that this PR implements;
            the conventions there are the standard to review against.

            Focus, most important first:
            1. Correctness bugs and edge cases (file handling, concurrency, camera/stream lifecycle).
            2. Security: path traversal, anything reachable from the LAN without auth that shouldn't be,
               secrets in code or workflows.
            3. Tests: behaviours from the task file that are missing or untested, tests that don't follow
               Arrange/Act/Assert or the "when" naming, over-mocking.
            4. Performance on a Pi 5 (blocking work on the event loop, large images in memory).

            Only report issues you've verified in the code. Skip style nits that ruff would catch.
            Post inline comments for specific lines, and one top-level markdown summary with a table of
            findings (severity, file:line, issue, suggested fix). If nothing is wrong, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
